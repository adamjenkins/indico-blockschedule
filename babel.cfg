# Message extraction for the plugin's Python and Jinja code.
#
# Indico's `i18n extract plugin` looks for this file in the plugin root and
# falls back to `../babel.cfg` — the layout of the indico-plugins monorepo,
# where one config is shared by every plugin beside it. This plugin stands on
# its own, so it carries its own.
[python: **.py]
encoding = utf-8

[jinja2: **/templates/**.html]
encoding = utf-8
trimmed = true
