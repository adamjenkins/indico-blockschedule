[project]
name = 'indico-plugin-blockschedule'
description = 'A simpler, grid-based timetable for Indico events'
readme = 'README.md'
version = '0.3.1'
license = 'MIT'
authors = [
    { name = 'Adam Jenkins' },
]
requires-python = '>=3.12.2, <3.13'
dependencies = ['indico>=3.3.13', 'odfpy>=1.4']

[project.entry-points.'indico.plugins']
blockschedule = 'indico_blockschedule.plugin:BlockschedulePlugin'

[build-system]
requires = ['hatchling==1.28.0']
build-backend = 'hatchling.build'

[tool.hatch.build]
packages = ['indico_blockschedule']
exclude = [
    '*.no-header',
    '.keep',
    'indico_*/client/',
    'tests/',
    '*_test.py',
]
artifacts = [
    'indico_*/translations/**/messages-react.json',
    'indico_*/translations/**/*.mo',
    'indico_*/static/dist/',
]
