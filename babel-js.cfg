# Message extraction for plain JavaScript.
#
# The client is TypeScript and React, which Indico extracts separately with
# `react-jsx-i18n` into `messages-react.pot` — so this catalog is expected to
# come out empty, and Indico deletes an empty .pot rather than committing one.
# The file exists because the extractor needs a mapping even to find nothing.
[ignore: **/static/dist/**]

[javascript: **/client/**.js]
encoding = utf-8
domain = messages-js
